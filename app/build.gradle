plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.sureshtrb.karma'
    compileSdk 35

    defaultConfig {
        applicationId "com.sureshtrb.karma"
        minSdk 21
        targetSdk 35
        versionCode 50
        versionName "1.0.50"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug // change to release config when ready
        }
    }

    buildFeatures {
        compose true
        viewBinding true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    implementation 'androidx.annotation:annotation:1.9.1'
   // implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'


    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jsoup:jsoup:1.13.1'
    //implementation 'com.pawegio.kandroid:kandroid:0.8.7@aar'
    implementation 'com.github.pawegio:KAndroid:0.8.7'

    implementation 'com.pusher:pusher-java-client:2.2.5'
    implementation 'com.loopj.android:android-async-http:1.4.11'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.itextpdf:itextg:5.5.10'
    implementation 'com.github.barteksc:AndroidPdfViewer:3.1.0-beta.1' // ✅ CORRECT



    // Don't forget to change the line below with the latest version of Parse SDK for Android
    implementation "com.github.parse-community.Parse-SDK-Android:parse:1.20.0"
    implementation 'com.github.parse-community:ParseTwitterUtils-Android:1.13.0'

    // ButterKnife Dependency
    //implementation 'com.android.support:appcompat-v7:30.0.0'

    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'

    // Circular image view
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    //Audio

    implementation 'com.getbase:floatingactionbutton:1.9.0'

}